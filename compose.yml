# 🐉 Kali Linux Sandbox — compose para uso local com Docker
# Uso:
#   cp .env.example .env
#   docker compose up -d --build
# Depois abra http://localhost:6080/vnc.html (senha definida em VNC_PW).

services:
  kali:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KALI_TOOLS: ${KALI_TOOLS:-kali-tools-top10}
        USERNAME: ${USERNAME:-kali}
    image: docker-kali:latest
    container_name: kali
    hostname: kali
    environment:
      VNC_PW: ${VNC_PW:-kali}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1440x900}
      VNC_DEPTH: ${VNC_DEPTH:-24}
      VNC_PORT: ${VNC_PORT:-5901}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${NOVNC_PORT:-6080}:6080"   # 🌐 desktop no navegador (noVNC)
      - "${VNC_PORT:-5901}:5901"     # 🖥️ cliente VNC nativo
    volumes:
      - ./shared:/home/kali/shared  # 📁 pasta compartilhada com o host
      - kali-home:/home/kali/.local # persiste ajustes do usuário
    # Necessário apenas se quiser rodar Docker dentro do contêiner:
    # privileged: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  kali-home:
